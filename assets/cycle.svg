<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="ct"><title id="ct">Engineering cycle: Build, Evaluate, Improve, Validate, then repeat</title><rect width="900" height="250" rx="20" fill="#F5F7F1"/><rect x=".75" y=".75" width="898.5" height="248.5" rx="19.5" fill="none" stroke="#C7D9C4" stroke-width="1.5"/><circle cx="120" cy="86" r="30" fill="#385746"/><text x="120" y="94" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#fff">1</text><text x="120" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#385746">Build</text><text x="120" y="168" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#385746" opacity=".8">Ship a working version</text><line x1="162" y1="86" x2="298" y2="86" stroke="#8BA88D" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.2s" repeatCount="indefinite"/></line><path d="M292 80 l8 6 l-8 6" fill="none" stroke="#8BA88D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="86" r="30" fill="#385746"/><text x="340" y="94" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#fff">2</text><text x="340" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#385746">Evaluate</text><text x="340" y="168" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#385746" opacity=".8">Test it against the real problem</text><line x1="382" y1="86" x2="518" y2="86" stroke="#8BA88D" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.2s" repeatCount="indefinite"/></line><path d="M512 80 l8 6 l-8 6" fill="none" stroke="#8BA88D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="86" r="30" fill="#385746"/><text x="560" y="94" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#fff">3</text><text x="560" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#385746">Improve</text><text x="560" y="168" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#385746" opacity=".8">Refine UX, code and reliability</text><line x1="602" y1="86" x2="738" y2="86" stroke="#8BA88D" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.2s" repeatCount="indefinite"/></line><path d="M732 80 l8 6 l-8 6" fill="none" stroke="#8BA88D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="780" cy="86" r="30" fill="#385746"/><text x="780" y="94" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#fff">4</text><text x="780" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#385746">Validate</text><text x="780" y="168" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#385746" opacity=".8">Check that it actually helps</text><path d="M780 196 C 780 232, 700 232, 450 232 C 200 232, 120 232, 120 196" fill="none" stroke="#8BA88D" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><path d="M114 205 l6 -10 l6 10" fill="none" stroke="#8BA88D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="400" y="218" width="100" height="28" rx="14" fill="#F5F7F1"/><text x="450" y="237" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#385746">repeat</text></svg>